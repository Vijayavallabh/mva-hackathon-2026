[project]
name = "track2-evo2-comparison"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "evo2==0.6.0",
  "vtx==1.1.0",
  "torch==2.6.0",
  "numpy==1.26.4",
  "flash-attn==2.8.0.post2",
  "ninja>=1.13.2",
  "packaging>=26.3",
  "setuptools>=84.0.0",
  "wheel>=0.48.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
